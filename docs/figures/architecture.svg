<title id="title">Co-Investigator architecture</title><desc id="desc">A scientist directs Codex or Claude Code through goals, methods, preferences, and feedback. The host applies interacting scientific skills, invokes executable tools, and maintains project context linked to preserved evidence. Plans and interpretation return to the scientist. Independent reviewers operate in separate contexts on request. The scientist performs experiments and supplies observations.</desc>
