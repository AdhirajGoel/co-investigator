<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">Scientist-directed collaboration architecture</title><desc id="desc">Three panels show an iterative research workflow, scientist control through host agents and durable project records, and an optional two-round independent review process. The workflow is instructional and host-mediated, not an automated research service.</desc>
<g font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="1080" rx="0" fill="#ffffff" stroke="#ffffff"/>
<rect x="16" y="12" width="1168" height="290" rx="12" fill="#ffffff" stroke="#ccd7dd"/>
<text x="35" y="44" font-size="26" font-weight="bold" fill="#173042" text-anchor="start">a</text>
<text x="72" y="44" font-size="23" font-weight="bold" fill="#173042" text-anchor="start">Research cycle directed by the scientist</text>
<text x="36" y="78" font-size="20" font-weight="normal" fill="#173042" text-anchor="start">The scientist sets the question, methods, acceptance criteria, and next decision.</text>
<rect x="36" y="105" width="177" height="116" rx="10" fill="#eaf2f8" stroke="#c4d0d8"/>
<text x="124.5" y="135" font-size="18" font-weight="bold" fill="#173042" text-anchor="middle">Inspect evidence</text>
<text x="124.5" y="167" font-size="17" font-weight="normal" fill="#173042" text-anchor="middle">Literature and</text>
<text x="124.5" y="192" font-size="17" font-weight="normal" fill="#173042" text-anchor="middle">source records</text>
<polyline points="213,163 226,163" fill="none" stroke="#6a7f8d" stroke-width="2"/>
<polygon points="226,163 217.0,159.0 217.0,167.0" fill="#6a7f8d"/>
